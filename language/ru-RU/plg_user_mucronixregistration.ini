PLG_USER_MUCRONIXREGISTRATION="Пользователь - Mucronix Registration"
PLG_USER_MUCRONIXREGISTRATION_XML_DESCRIPTION="Упрощённая регистрация со страной и регионом. Скрывает поле «Имя» в форме регистрации и сохраняет логин как имя, добавляет список стран и зависимый от него список регионов, сохраняет их вместе с IP-адресом регистрации в профиле пользователя. При удалении плагина удаляются таблица стран и регионов и сохранённые страна, регион и IP-адрес всех пользователей."
PLG_USER_MUCRONIXREGISTRATION_UNINSTALL_NOTE="При удалении плагина удаляются таблица стран и регионов и сохранённые для всех пользователей страна, регион и IP-адрес регистрации."

PLG_USER_MUCRONIXREGISTRATION_FIELDSET_LABEL="Местоположение"
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_LABEL="Страна"
PLG_USER_MUCRONIXREGISTRATION_REGION_LABEL="Регион"
PLG_USER_MUCRONIXREGISTRATION_SELECT_COUNTRY="- Выберите страну -"
PLG_USER_MUCRONIXREGISTRATION_SELECT_REGION="- Выберите регион -"
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_CODE_LABEL="Код страны"
PLG_USER_MUCRONIXREGISTRATION_REG_IP_LABEL="IP-адрес регистрации"
PLG_USER_MUCRONIXREGISTRATION_REG_IP_DESC="Записывается один раз при регистрации на сайте. Только для просмотра."
PLG_USER_MUCRONIXREGISTRATION_NOT_SPECIFIED="Не указано"

PLG_USER_MUCRONIXREGISTRATION_HIDE_NAME_LABEL="Скрыть поле «Имя»"
PLG_USER_MUCRONIXREGISTRATION_HIDE_NAME_DESC="В форме регистрации поле «Имя» скрыто, а именем сохраняется логин, что бы ни пришло в запросе. В профиле и в панели управления имя можно менять как обычно."
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_REQUIRED_LABEL="Страна обязательна"
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_REQUIRED_DESC="Для регистрации и правки профиля на сайте нужно указать страну. Регион тогда тоже обязателен, если у страны есть регионы и для неё показывается список регионов. В панели управления поля никогда не обязательны."
PLG_USER_MUCRONIXREGISTRATION_STORE_IP_LABEL="Сохранять IP-адрес"
PLG_USER_MUCRONIXREGISTRATION_STORE_IP_DESC="IP-адрес посетителя записывается один раз при регистрации на сайте. Последующая правка профиля его не меняет. Видит его только администратор."
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_LABEL="Страна и регион в профиле на сайте"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_DESC="Скрыть: не показываются ни на странице профиля, ни на странице правки. Только просмотр: показываются на странице профиля, меняет их только администратор; значение, присланное в запросе, игнорируется, сохранённое остаётся. Просмотр и правка: пользователь может их менять. В панели управления поля всегда показываются и редактируются."
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_HIDE="Скрыть"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_VIEW="Только просмотр"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_EDIT="Просмотр и правка"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_LABEL="Какие страны показывать"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_DESC="Все страны списка или только выбранные. Страна, уже сохранённая для пользователя, остаётся в его профиле, даже когда её больше не показывают."
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_ALL="Все"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_SELECTED="Только выбранные"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_LABEL="Выбранные страны"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_DESC="Если ничего не выбрано, показываются все страны."
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_LABEL="Для каких стран показывать регионы"
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_DESC="Показывать список регионов для каждой страны, у которой они есть, или только для выбранных стран. Для остальных стран поле региона скрыто и не обязательно. Регион, уже сохранённый для пользователя, остаётся."
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_ALL="Для всех, где они есть"
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_SELECTED="Только для выбранных"
PLG_USER_MUCRONIXREGISTRATION_REGION_COUNTRIES_LABEL="Страны с регионами"
PLG_USER_MUCRONIXREGISTRATION_REGION_COUNTRIES_DESC="Здесь перечислены только страны, у которых есть регионы. Если ничего не выбрано, список регионов не показывается."
PLG_USER_MUCRONIXREGISTRATION_TOP_COUNTRIES_LABEL="Страны в начале списка"
PLG_USER_MUCRONIXREGISTRATION_TOP_COUNTRIES_DESC="Двухбуквенные коды стран (ISO 3166-1) через запятую в нужном порядке, например UA, PL. Остальные страны идут дальше по алфавиту. Страна, которую не показывают, пропускается."

PLG_USER_MUCRONIXREGISTRATION_ERROR_COUNTRY_REQUIRED="Выберите страну."
PLG_USER_MUCRONIXREGISTRATION_ERROR_COUNTRY_INVALID="Выбранная страна недоступна."
PLG_USER_MUCRONIXREGISTRATION_ERROR_REGION_REQUIRED="Выберите регион для выбранной страны."
PLG_USER_MUCRONIXREGISTRATION_ERROR_REGION_MISMATCH="Выбранный регион не относится к выбранной стране."
PLG_USER_MUCRONIXREGISTRATION_ERROR_REGION_NOT_OFFERED="Для выбранной страны регионы недоступны."
PLG_USER_MUCRONIXREGISTRATION_ERROR_TOP_COUNTRIES="Страны в начале списка: неизвестные коды стран %s."
