PLG_USER_MUCRONIXREGISTRATION="Користувач. Mucronix Registration"
PLG_USER_MUCRONIXREGISTRATION_XML_DESCRIPTION="Спрощена реєстрація з країною та регіоном. Приховує поле «Ім'я» у формі реєстрації й зберігає логін як ім'я, додає список країн і залежний від нього список регіонів, зберігає їх разом з IP-адресою реєстрації в профілі користувача. Під час видалення плагіна видаляються таблиця країн і регіонів та збережені країна, регіон і IP-адреса всіх користувачів."
PLG_USER_MUCRONIXREGISTRATION_INSTALL_MESSAGE="Mucronix Registration встановлено. Плагін вимкнений, доки ви не ввімкнете його в <a href='%s'>налаштуваннях плагіна</a>."
