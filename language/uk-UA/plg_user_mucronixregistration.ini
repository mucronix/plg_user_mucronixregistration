PLG_USER_MUCRONIXREGISTRATION_REG_IP_DESC="Записується один раз під час реєстрації на сайті. Лише для перегляду."
PLG_USER_MUCRONIXREGISTRATION_NOT_SPECIFIED="Не вказано"

PLG_USER_MUCRONIXREGISTRATION_HIDE_NAME_LABEL="Приховати поле «Ім'я»"
PLG_USER_MUCRONIXREGISTRATION_HIDE_NAME_DESC="У формі реєстрації поле «Ім'я» приховане, а ім'ям зберігається логін, що б не прийшло в запиті. У профілі та в панелі керування ім'я можна змінювати як звичайно."
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_REQUIRED_LABEL="Країна обов'язкова"
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_REQUIRED_DESC="Для реєстрації та редагування профілю на сайті потрібно вказати країну. Регіон тоді теж обов'язковий, якщо в країни є регіони і для неї показується список регіонів. У панелі керування поля ніколи не обов'язкові."
PLG_USER_MUCRONIXREGISTRATION_STORE_IP_LABEL="Зберігати IP-адресу"
PLG_USER_MUCRONIXREGISTRATION_STORE_IP_DESC="IP-адреса відвідувача записується один раз під час реєстрації на сайті. Подальше редагування профілю її не змінює. Бачить її лише адміністратор."
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_LABEL="Країна та регіон у профілі на сайті"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_DESC="Приховати: не показуються ні на сторінці профілю, ні на сторінці редагування. Лише перегляд: показуються на сторінці профілю, змінює їх лише адміністратор; значення, надіслане в запиті, ігнорується, збережене залишається. Перегляд і редагування: користувач може їх змінювати. У панелі керування поля завжди показуються й редагуються."
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_HIDE="Приховати"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_VIEW="Лише перегляд"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_EDIT="Перегляд і редагування"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_LABEL="Які країни показувати"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_DESC="Усі країни списку або лише обрані. Країна, вже збережена для користувача, залишається в його профілі, навіть коли її більше не показують."
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_ALL="Усі"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_SELECTED="Лише обрані"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_LABEL="Обрані країни"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_DESC="Якщо нічого не обрано, показуються всі країни."
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_LABEL="Для яких країн показувати регіони"
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_DESC="Показувати список регіонів для кожної країни, в якої вони є, або лише для обраних країн. Для інших країн поле регіону приховане й не обов'язкове. Регіон, уже збережений для користувача, залишається."
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_ALL="Для всіх, де вони є"
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_SELECTED="Лише для обраних"
PLG_USER_MUCRONIXREGISTRATION_REGION_COUNTRIES_LABEL="Країни з регіонами"
PLG_USER_MUCRONIXREGISTRATION_REGION_COUNTRIES_DESC="Тут перелічено лише країни, в яких є регіони. Якщо нічого не обрано, список регіонів не показується."
PLG_USER_MUCRONIXREGISTRATION_TOP_COUNTRIES_LABEL="Країни на початку списку"
PLG_USER_MUCRONIXREGISTRATION_TOP_COUNTRIES_DESC="Двобуквені коди країн (ISO 3166-1) через кому в потрібному порядку, наприклад UA, PL. Інші країни йдуть далі за абеткою. Країна, яку не показують, пропускається."

