PLG_USER_MUCRONIXREGISTRATION="User - Mucronix Registration"
PLG_USER_MUCRONIXREGISTRATION_XML_DESCRIPTION="Simpler registration with country and region. Hides the Name field on the registration form and stores the username as the name, adds a country list and a dependent region list, and stores them together with the registration IP address in the user profile. Uninstalling removes the countries and regions table and the country, region and IP address stored for all users."
PLG_USER_MUCRONIXREGISTRATION_INSTALL_MESSAGE="Mucronix Registration is installed. The plugin is disabled until you enable it in the <a href='%s'>plugin settings</a>."
