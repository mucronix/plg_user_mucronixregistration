PLG_USER_MUCRONIXREGISTRATION_SELECT_REGION="- Select region -"
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_CODE_LABEL="Country code"
PLG_USER_MUCRONIXREGISTRATION_REG_IP_LABEL="Registration IP address"
PLG_USER_MUCRONIXREGISTRATION_REG_IP_DESC="Recorded once at registration on the site. Read-only."
PLG_USER_MUCRONIXREGISTRATION_NOT_SPECIFIED="Not specified"

PLG_USER_MUCRONIXREGISTRATION_HIDE_NAME_LABEL="Hide Name Field"
PLG_USER_MUCRONIXREGISTRATION_HIDE_NAME_DESC="On the registration form the Name field is hidden and the username is stored as the name, whatever the request contains. In the profile and in the administrator area the name can be changed as usual."
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_REQUIRED_LABEL="Country Required"
PLG_USER_MUCRONIXREGISTRATION_COUNTRY_REQUIRED_DESC="Registration and profile editing on the site require a country. A region is then required as well when the country has regions and the region list is shown for it. In the administrator area the fields are never required."
PLG_USER_MUCRONIXREGISTRATION_STORE_IP_LABEL="Store IP Address"
PLG_USER_MUCRONIXREGISTRATION_STORE_IP_DESC="The visitor's IP address is recorded once at registration on the site. Editing the profile later does not change it. Only an administrator sees it."
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_LABEL="Country and Region in the Site Profile"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_DESC="Hide: not shown on the profile page or on the edit page. View only: shown on the profile page and changed only by an administrator; a value sent with the request is ignored and the saved one stays. View and edit: the user can change them. In the administrator area the fields are always shown and editable."
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_HIDE="Hide"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_VIEW="View only"
PLG_USER_MUCRONIXREGISTRATION_PROFILE_SITE_EDIT="View and edit"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_LABEL="Countries to Show"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_DESC="All countries of the list or only the selected ones. A country already saved for a user stays in that user's profile even when it is no longer shown."
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_ALL="All"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_MODE_SELECTED="Only selected"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_LABEL="Selected Countries"
PLG_USER_MUCRONIXREGISTRATION_COUNTRIES_DESC="When nothing is selected, all countries are shown."
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_LABEL="Show Regions"
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_DESC="Show the region list for every country that has regions or only for the selected countries. For other countries the region field is hidden and not required. A region already saved for a user stays."
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_ALL="For all that have them"
PLG_USER_MUCRONIXREGISTRATION_REGIONS_MODE_SELECTED="Only for selected"
PLG_USER_MUCRONIXREGISTRATION_REGION_COUNTRIES_LABEL="Countries with Regions"
PLG_USER_MUCRONIXREGISTRATION_REGION_COUNTRIES_DESC="Only countries that have regions are listed here. When nothing is selected, no region list is shown."
PLG_USER_MUCRONIXREGISTRATION_TOP_COUNTRIES_LABEL="Countries at the Top"
PLG_USER_MUCRONIXREGISTRATION_TOP_COUNTRIES_DESC="Two-letter country codes (ISO 3166-1) separated by commas, in the order they should appear, for example UA, PL. The other countries follow alphabetically. A country that is not shown is skipped."

